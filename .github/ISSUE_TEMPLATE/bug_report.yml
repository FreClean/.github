name: Bug report
description: Report a reproducible problem in an official FreClean repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private keys, customer personal data, production credentials, or unredacted logs.
  - type: input
    id: repository
    attributes:
      label: Affected repository
      description: Choose the official repository where the issue occurs.
      placeholder: FreClean, freclean-website, freclean-app, or .github
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe what happened using non-sensitive details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use test data and redact any sensitive values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions and platform details only.
    validations:
      required: false
