name: Bug Report
description: Report something in a FreClean repository that isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If this is a **security vulnerability**, do not file it here — email freclean7@gmail.com instead (see SUPPORT.md).

  - type: input
    id: repo
    attributes:
      label: Which repository?
      placeholder: e.g. freclean-api
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Which version, tag, or commit did you see this on?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that would help.
