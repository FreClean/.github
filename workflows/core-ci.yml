name: Core CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present -- --runInBand

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret validation
        run: |
          if git grep -nE '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|xox[baprs]-)' -- . ':!package-lock.json' >/tmp/freclean-secrets.txt; then
            echo 'Potential secret detected in repository contents.' >&2
            cat /tmp/freclean-secrets.txt >&2
            exit 1
          fi