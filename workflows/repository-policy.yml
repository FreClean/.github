name: Repository policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject prohibited payment-network brands in text content
        run: |
          set +e
          grep -RniIE '(^|[^[:alnum:]_])([v][i][s][a]|master[[:space:]-]?card)([^[:alnum:]_]|$)' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=vendor \
            --exclude-dir=dist \
            --exclude-dir=build \
            .
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'Prohibited payment-network brand reference found in text content.' >&2
            exit 1
          elif [ "$result" -ne 1 ]; then
            echo 'Unable to scan repository text content.' >&2
            exit "$result"
          fi

      - name: Reject prohibited legacy crypto asset references
        run: |
          if grep -RniE 'c[Uu][Ss][Dd]' --exclude-dir=.git .; then
            echo 'Prohibited legacy crypto asset reference found.' >&2
            exit 1
          fi

      - name: Reject temporary or demo production content
        run: |
          if grep -RniE '(TODO|FIXME|example\.com|coming soon|temporarily|replace this|implement later|fake production|mock production|demo-only)' --exclude-dir=.git .; then
            echo 'Temporary or demo production content found.' >&2
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository architecture gate
        run: |
          if ! grep -Rni 'FreClean/FreClean\|FreClean/freclean-app\|FreClean/freclean-website\|FreClean/.github' README.md architecture-contract.md profile/README.md >/dev/null; then
            echo 'Architecture contract mismatch detected.' >&2
            exit 1
          fi